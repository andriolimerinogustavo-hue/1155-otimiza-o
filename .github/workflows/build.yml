name: Gerar 1155.exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: python -m pip install pyinstaller

      - name: Gerar o executável
        run: python -m PyInstaller --onefile --uac-admin --clean --name 1155 tweaks.py

      - name: Gerar checksum SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/1155.exe -Algorithm SHA256).Hash.ToLower()
          "$h  1155.exe" | Out-File -Encoding ascii dist/1155.exe.sha256

      - name: Guardar o .exe como artefato
        uses: actions/upload-artifact@v4
        with:
          name: 1155-exe
          path: dist/

      - name: Publicar no Releases (apenas em tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/1155.exe
            dist/1155.exe.sha256
